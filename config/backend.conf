# QO100_TRX2: two tunable USB receivers, two fixed monitors and USB transmitter. Frequencies in Hz.
pluto_uri = ip:192.168.10.25
# Persistent GUI changes override these defaults in backend.settings.
lnb_reference_hz = 25000000
rx_correction_hz = 0
tx_correction_hz = 0
pluto_sample_rate = 1200000

# Satellite/downlink display center -> actual Pluto RX center.
rx_center_hz = 10489750000
# Calculated: rx_center_hz - lnb_reference_hz * 390 + rx_correction_hz.
# Kept for compatibility; this legacy value is replaced by the calculation.
pluto_rx_hz = 739750000
rx_bandwidth_hz = 600000

# Satellite uplink band center -> actual Pluto TX center (full duplex).
tx_center_hz = 2400250000
pluto_tx_hz = 1290250000

# The driver link is always 127.0.0.1:40808/40809/40810 (not configurable).
# Only the GUI link can use the LAN. The GUI subscribes to this port.
gui_bind = 0.0.0.0
gui_port = 40900
subscription_seconds = 8

fft_size = 8192
spectrum_fps = 20
initial_rx_hz = 10489900000
# Independent second USB receiver paired with the external digital TX2.
initial_rx2_hz = 10489600000
# Monitoring USB carriers; editable and persistent through WebGUI Setup (Hz).
rx3_frequency_hz = 10489540000
rx4_frequency_hz = 10489748821

# Independent uplink carrier, GUI PTT is OFF at startup.
initial_tx_hz = 2400400000
# RX2/TX2 digital pair; independent uplink carrier, no PTT control.
initial_tx2_hz = 2400100000
# Actual AD9361 TX attenuation in dB (0 = maximum output).
tx_attenuation_db = 0

# RX1 audio filter only: lower/upper audio cutoff relative to the USB carrier.
# Both inside 100..4000 Hz, at least 500 Hz apart.
rx1_filter_low_hz = 100
rx1_filter_high_hz = 4000

# RX1 speech noise reduction (SpeexDSP): 0 = bypass, 100 = up to 30 dB noise attenuation.
rx1_nr_percent = 0

# TX1 speech compression: 100 = normal; GUI range 60..140%; 0 = API bypass.
tx1_compressor_percent = 100
