# QO100_TRX2: FFT, two USB receivers and USB transmitter. Frequencies in Hz.
pluto_uri = ip:192.168.10.25
pluto_sample_rate = 1200000

# Satellite/downlink display center -> actual Pluto RX center.
rx_center_hz = 10489750000
pluto_rx_hz = 739750000
rx_bandwidth_hz = 600000

# Satellite uplink band center -> actual Pluto TX center (full duplex).
tx_center_hz = 2400250000
pluto_tx_hz = 1290250000

# The driver link is always 127.0.0.1:40808/40809/40810 (not configurable).
# Only the GUI link can use the LAN. The GUI subscribes to this port.
gui_bind = 0.0.0.0
gui_port = 40900
subscription_seconds = 8

fft_size = 8192
spectrum_fps = 20
initial_rx_hz = 10489900000
# Independent second USB receiver, reserved for future external digital decoding.
initial_rx2_hz = 10489600000

# Independent uplink carrier, GUI PTT is OFF at startup.
initial_tx_hz = 2400400000
# Actual AD9361 TX attenuation in dB (0 = maximum output).
tx_attenuation_db = 0
