# HTTP/WS only; TLS termination is handled by the OPNsense reverse proxy.
listen = 0.0.0.0
port = 8080
backend_port = 40900
# Local monitors: independent audio/text ports. Set BOTH ports of a link to 0 to disable.
# RX2 has no decoder connection. Monitor PCM is never sent to browsers.
rx3_decoder_audio_port = 40910
rx3_decoder_text_port = 40911
rx4_decoder_audio_port = 40912
rx4_decoder_text_port = 40913
rx5_decoder_audio_port = 40916
mm_http_port = 8766
# RX2 PCM / TX2 state to the audio adapter; TX2 PCM back to this bridge.
digital_audio_port = 40914
digital_bridge_port = 40915
web_root = ../web
# Keep receive/monitoring sessions connected without mouse/keyboard activity.
# TX1 PTT has its own watchdog and five-minute maximum in the WebGUI.
idle_seconds = 0
# Native WebSocket ping/pong; independent of browser JavaScript timers.
heartbeat_seconds = 60
max_clients = 16
queue_bytes = 524288
