# HTTP/WS only; TLS termination is handled by the OPNsense reverse proxy.
listen = 0.0.0.0
port = 8080
backend_port = 40900
# Local external decoder: RX2 audio to its port; plain UTF-8 text replies to the adapter.
# Set BOTH to 0 to disable. RX2 audio is never sent to browsers.
decoder_audio_port = 40910
decoder_text_port = 40911
web_root = ../web
idle_seconds = 300
max_clients = 16
queue_bytes = 524288
